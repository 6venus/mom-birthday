<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>妈妈，45岁生日快乐！</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #ffecf1 0%, #fff5f7 50%, #fff 100%);
            color: #5d4037;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* 背景装饰 */
        .decoration {
            position: absolute;
            font-size: 20px;
            opacity: 0.4;
            z-index: -1;
            animation: float 8s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        @keyframes gentle-pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            background: rgba(255, 255, 255, 0.98);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(188, 143, 143, 0.1);
            border: 1px solid rgba(255, 182, 193, 0.2);
            position: relative;
        }

        .age-badge {
            background: linear-gradient(135deg, #ffb6c1 0%, #ffccd5 100%);
            color: #8b4513;
            display: inline-block;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 1.1em;
            margin-bottom: 15px;
            font-weight: bold;
            animation: gentle-pulse 3s infinite;
        }

        h1 {
            color: #c2185b;
            font-size: 2.5em;
            margin: 10px 0 25px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .subtitle {
            color: #8b4513;
            font-size: 1.2em;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .photo-gallery {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin: 30px 0;
        }

        .photo-frame {
            width: 250px;
            height: 250px;
            border: 10px solid white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            transition: all 0.4s ease;
            position: relative;
            cursor: pointer;
        }

        .photo-frame:hover {
            transform: scale(1.03);
            box-shadow: 0 12px 25px rgba(194, 24, 91, 0.15);
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .photo-frame:hover img {
            transform: scale(1.05);
        }

        .photo-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(194, 24, 91, 0.85);
            color: white;
            padding: 8px;
            font-size: 0.9em;
            text-align: center;
        }

        .message-box {
            background: #fff9fb;
            border-radius: 15px;
            padding: 25px;
            margin: 30px 0;
            border-left: 5px solid #ffb6c1;
        }

        .message {
            font-size: 1.3em;
            line-height: 1.8;
            color: #5d4037;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin: 30px 0;
        }

        button {
            background: linear-gradient(135deg, #ffb6c1 0%, #ffccd5 100%);
            color: #8b4513;
            border: none;
            padding: 14px 30px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(255, 182, 193, 0.3);
            font-weight: bold;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 18px rgba(255, 182, 193, 0.4);
        }

        .hidden-message {
            background: #fff5f7;
            border-radius: 15px;
            padding: 25px;
            margin-top: 25px;
            border: 2px solid #ffccd5;
            display: none;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .floating-heart {
            position: fixed;
            font-size: 18px;
            color: #ffb6c1;
            pointer-events: none;
            z-index: 9999;
        }

        .simple-footer {
            margin-top: 40px;
            color: #8b4513;
            font-size: 1em;
            padding-top: 20px;
            border-top: 1px solid rgba(139, 69, 19, 0.1);
            opacity: 0.8;
        }

        /* 音乐控制栏样式 */
        #musicControl {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px;
            border-radius: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            border: 2px solid rgba(255, 182, 193, 0.3);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideInUp 0.6s ease-out;
        }

        @keyframes slideInUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        #musicControl button:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 8px 25px rgba(255, 182, 193, 0.5);
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
                margin: 10px;
            }

            h1 {
                font-size: 2em;
            }

            .photo-frame {
                width: 220px;
                height: 220px;
            }

            .buttons {
                flex-direction: column;
                align-items: center;
            }

            button {
                width: 100%;
                max-width: 300px;
            }

            #musicControl {
                bottom: 15px;
                right: 15px;
                padding: 10px;
            }

            #musicControl button {
                width: 45px;
                height: 45px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div id="decorations"></div>

    <div class="container">
        <div class="age-badge">🎂 45岁，最好的年华 🎂</div>
        <h1>妈妈，生日快乐！</h1>
        <p class="subtitle">祝我最爱的妈妈，新的一岁健康快乐！</p>

        <div class="photo-gallery">
            <div class="photo-frame" onclick="showPhotoMessage(0)">
                <img src="images/mom1.jpg" alt="妈妈的照片">
                <div class="photo-label">最美的妈妈</div>
            </div>
            <div class="photo-frame" onclick="showPhotoMessage(1)">
                <img src="images/mom3.jpg" alt="妈妈的照片">
                <div class="photo-label">温柔时刻</div>
            </div>
            <div class="photo-frame" onclick="showPhotoMessage(2)">
                <img src="images/mom5.jpg" alt="妈妈的照片">
                <div class="photo-label">开心笑容</div>
            </div>
            <div class="photo-frame" onclick="showPhotoMessage(3)">
                <img src="images/mom4.jpg" alt="妈妈的照片">
                <div class="photo-label">优雅时刻</div>
            </div>
            <div class="photo-frame" onclick="showPhotoMessage(4)">
                <img src="images/mom2.jpg" alt="妈妈的照片">
                <div class="photo-label">幸福时光</div>
            </div>
        </div>

        <div class="message-box">
            <p class="message" id="dynamicMessage">点击按钮，接收女儿的生日祝福</p>
        </div>

        <div class="buttons">
            <button onclick="showBlessing()">🎂 生日祝福</button>
            <button onclick="showWish()">🌟 美好祝愿</button>
            <button onclick="showFuture()">🌼 展望未来</button>
            <button onclick="showGratitude()">💝 感谢的话</button>
        </div>

        <div class="hidden-message" id="secretMessage">
            <h3 style="color: #c2185b; margin-bottom: 15px;">🎁 给妈妈的小惊喜</h3>
           <p id="secretContent"></p>
        <div style="margin-top: 20px; padding: 20px; background: linear-gradient(135deg, #fff5f7 0%, #fff 100%); border-radius: 15px; border: 2px dashed #ffb6c1;">
        <p style="color: #c2185b; font-size: 1.1em; margin-bottom: 15px;">
            <strong>🎉 虽然人在学校，但心意一定送到！</strong>
        </p>

        <div style="background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px;">
            <p style="color: #5d4037; margin: 10px 0;">
                💖 <strong>生日红包已就位！</strong> 微信转账请注意查收～
            </p>
        </div>

    </div>
</div>

        <div class="simple-footer">
            <p>💖 女儿用代码写给您的生日贺卡</p>
            <p style="margin-top: 10px; font-size: 0.9em;">制作时间：<span id="currentDate"></span></p>
        </div>
    </div>

    <!-- 音频元素 -->
    <audio id="bgMusic" loop preload="auto" style="display:none;">
        <source src="assets/ukulele.mp3" type="audio/mpeg">
        您的浏览器不支持音频播放
    </audio>

    <audio id="clickSound" preload="auto" style="display:none;">
        <!-- 在线点击音效，无需下载 -->
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-select-click-1109.mp3" type="audio/mpeg">
    </audio>

    <audio id="heartSound" preload="auto" style="display:none;">
        <!-- 在线爱心音效，无需下载 -->
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-love-heart-1090.mp3" type="audio/mpeg">
    </audio>

    <!-- 音乐控制面板 -->
    <div id="musicControl">
        <button onclick="toggleMusic()" id="musicBtn"
                style="background:linear-gradient(135deg, #ffb6c1 0%, #ffccd5 100%);
                       color:white; border:none; border-radius:50%; width:50px; height:50px;
                       font-size:22px; cursor:pointer; transition:all 0.3s ease;">
            🎵
        </button>
        <div style="text-align:left;">
            <div id="musicStatus" style="color:#c2185b; font-weight:bold; font-size:0.9em;">
                生日快乐歌
            </div>
            <div id="musicHint" style="color:#8b4513; font-size:0.8em; opacity:0.8;">
                点击播放
            </div>
        </div>
    </div>

    <script>
        // ==================== 音频控制部分 ====================
        let isMusicPlaying = false;
        const bgMusic = document.getElementById('bgMusic');
        const clickSound = document.getElementById('clickSound');
        const heartSound = document.getElementById('heartSound');

        // 设置初始音量
        bgMusic.volume = 0.4;
        clickSound.volume = 0.6;
        heartSound.volume = 0.6;

        // 音乐切换函数
        function toggleMusic() {
            const btn = document.getElementById('musicBtn');
            const status = document.getElementById('musicStatus');
            const hint = document.getElementById('musicHint');

            if (isMusicPlaying) {
                // 停止音乐
                bgMusic.pause();
                btn.innerHTML = '🎵';
                btn.style.background = 'linear-gradient(135deg, #ffb6c1 0%, #ffccd5 100%)';
                status.innerHTML = '生日快乐歌';
                hint.innerHTML = '点击播放';
                isMusicPlaying = false;
            } else {
                // 播放音乐
                const playPromise = bgMusic.play();

                if (playPromise !== undefined) {
                    playPromise
                        .then(() => {
                            // 播放成功
                            btn.innerHTML = '🔊';
                            btn.style.background = 'linear-gradient(135deg, #4CAF50 0%, #8BC34A 100%)';
                            status.innerHTML = '播放中';
                            hint.innerHTML = '尤克里里版';
                            isMusicPlaying = true;
                        })
                        .catch(error => {
                            // 播放失败（需要用户交互）
                            console.log('需要用户交互后才能播放:', error);
                            btn.innerHTML = '▶️';
                            btn.style.background = 'linear-gradient(135deg, #FF9800 0%, #FFC107 100%)';
                            status.innerHTML = '需要点击激活';
                            hint.innerHTML = '先点击页面任意位置';

                            // 显示提示
                            setTimeout(() => {
                                document.getElementById('dynamicMessage').innerHTML =
                                    '🎵 请先点击页面任意位置，再点击音乐按钮播放生日快乐歌';
                                createHearts(2);
                            }, 500);
                        });
                }
            }
        }

        // 播放音效函数
        function playSound(type) {
            let sound;
            switch(type) {
                case 'click':
                    sound = clickSound;
                    break;
                case 'heart':
                    sound = heartSound;
                    break;
                default:
                    return;
            }

            if (sound) {
                sound.currentTime = 0;
                sound.play().catch(e => {
                    console.log('音效播放失败:', e);
                });
            }
        }

        // 页面点击激活音频
        let audioActivated = false;
        document.addEventListener('click', function activateAudio() {
            if (!audioActivated) {
                // 预加载所有音频
                bgMusic.load();
                clickSound.load();
                heartSound.load();

                // 更新提示
                document.getElementById('musicHint').innerHTML = '已激活，可播放';
                document.getElementById('musicBtn').innerHTML = '🎵';

                audioActivated = true;

                // 显示提示
                setTimeout(() => {
                    const currentMsg = document.getElementById('dynamicMessage').innerHTML;
                    document.getElementById('dynamicMessage').innerHTML =
                        currentMsg + '<br><small style="color:#8b4513;">🎶 音频已激活，可以播放音乐了</small>';
                }, 1000);
            }
        }, { once: true });

        // ==================== 原有功能 ====================

        // 创建简单装饰
        function createDecorations() {
            const container = document.getElementById('decorations');
            const symbols = ['🌸', '🎀', '🎈', '✨', '🎉', '💐'];

            for (let i = 0; i < 12; i++) {
                const deco = document.createElement('div');
                deco.className = 'decoration';
                deco.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
                deco.style.left = Math.random() * 100 + 'vw';
                deco.style.top = Math.random() * 100 + 'vh';
                deco.style.animationDelay = Math.random() * 5 + 's';
                deco.style.fontSize = (Math.random() * 15 + 15) + 'px';
                container.appendChild(deco);
            }
        }

        // 自然真实的祝福语 - 针对45岁
        const blessings = [
            "妈，45岁生日快乐！希望新的一岁您健康平安，笑口常开。",
            "祝妈妈45岁生日快乐！愿您永远保持年轻的心态，享受美好生活。",
            "妈妈生日快乐！45岁是新的开始，愿您每一天都充满阳光和快乐。",
            "祝我最爱的妈妈45岁生日快乐！身体健康最重要，一定要照顾好自己。",
            "妈，生日快乐！感谢您45年来的付出，希望您以后多为自己着想。",
            "妈妈，45岁生日快乐！愿您的生活像春天的花儿一样灿烂美好。",
            "祝妈妈生日快乐！45岁的您依然充满魅力，愿岁月温柔待您。",
            "妈，生日快乐！新的一岁，愿您少些操劳，多些属于自己的时间。"
        ];

        // 美好祝愿
        const wishes = [
            "愿您身体健康，吃嘛嘛香！",
            "希望您每天都能睡到自然醒，没有烦恼。",
            "祝愿您和朋友们聚会开心，旅行愉快！",
            "愿您找到更多自己的兴趣爱好，享受生活。",
            "希望您少为我们操心，多为自己考虑。",
            "愿您永远保持好心情，笑容常驻！"
        ];

        // 未来展望
        const futures = [
            "等我工作了，带您去更多好玩的地方。",
            "未来还要一起过很多很多个生日呢！",
            "明年生日，我会准备更大的惊喜哦！"
        ];

        // 感谢的话
        const gratitudes = [
            "谢谢您总是把最好的留给我们。",
            "感谢您为我们这个家的付出。",
            "谢谢您教会我乐观面对生活。",
            "感谢您一直以来的支持和理解。",
            "有您这样的妈妈，我很幸运。"
        ];

        let currentIndex = 0;

        // 修改原有函数，添加音效
        function showBlessing() {
            const message = blessings[currentIndex % blessings.length];
            document.getElementById('dynamicMessage').innerHTML = `🎂 ${message}`;
            createHearts(3);
            playSound('click');
            currentIndex++;
        }

        function showWish() {
            const wish = wishes[Math.floor(Math.random() * wishes.length)];
            document.getElementById('dynamicMessage').innerHTML = `✨ ${wish}`;
            createHearts(2);
            playSound('heart');
        }

        function showFuture() {
            const future = futures[Math.floor(Math.random() * futures.length)];
            document.getElementById('dynamicMessage').innerHTML = `🌼 ${future}`;
            createSparkles(5);
            playSound('click');
        }

        function showGratitude() {
            const gratitude = gratitudes[Math.floor(Math.random() * gratitudes.length)];
            document.getElementById('dynamicMessage').innerHTML = `💝 ${gratitude}`;
            showSecretMessage("妈妈，其实还有很多感谢的话想说。谢谢您总是无条件的爱我、支持我。");
            createHearts(5);
            playSound('heart');
        }

        function showPhotoMessage(photoIndex) {
            const messages = [
                "这张照片里的您真好看！",
                "喜欢您笑起来的模样。",
                "妈妈怎么拍都好看。",
                "这张特别有气质。",
                "我们的美好回忆。"
            ];
            const message = messages[photoIndex];
            document.getElementById('dynamicMessage').innerHTML = `📷 ${message}`;
            createHearts(1);
            playSound('click');
        }

        function showSecretMessage(content) {
            document.getElementById('secretContent').textContent = content;
            document.getElementById('secretMessage').style.display = 'block';

            document.getElementById('secretMessage').scrollIntoView({
                behavior: 'smooth',
                block: 'center'
            });
        }

        // 创建飘落爱心
        function createHearts(count) {
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'floating-heart';
                    heart.innerHTML = '💖';
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.top = '-30px';
                    heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
                    heart.style.animation = `fall ${Math.random() * 2 + 2}s linear forwards`;

                    document.body.appendChild(heart);

                    setTimeout(() => heart.remove(), 4000);
                }, i * 150);
            }
        }

        // 创建闪烁效果
        function createSparkles(count) {
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const sparkle = document.createElement('div');
                    sparkle.className = 'floating-heart';
                    sparkle.innerHTML = '✨';
                    sparkle.style.left = Math.random() * 100 + 'vw';
                    sparkle.style.top = Math.random() * 100 + 'vh';
                    sparkle.style.fontSize = (Math.random() * 15 + 10) + 'px';
                    sparkle.style.animation = `sparkle ${Math.random() * 1 + 0.5}s ease infinite`;

                    document.body.appendChild(sparkle);

                    setTimeout(() => sparkle.remove(), 1500);
                }, i * 200);
            }
        }

        // 设置当前日期
        function setCurrentDate() {
            const now = new Date();
            const options = {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                weekday: 'long'
            };
            document.getElementById('currentDate').textContent =
                now.toLocaleDateString('zh-CN', options);
        }

        // 页面加载初始化
        window.onload = function() {
            createDecorations();
            setCurrentDate();
            showBlessing();

            // 添加CSS动画定义
            const style = document.createElement('style');
            style.textContent = `
                @keyframes fall {
                    to {
                        transform: translateY(100vh) rotate(180deg);
                        opacity: 0;
                    }
                }
                @keyframes sparkle {
                    0%, 100% { opacity: 0.5; transform: scale(1); }
                    50% { opacity: 1; transform: scale(1.2); }
                }
            `;
            document.head.appendChild(style);

            // 3秒后提示音乐功能
            setTimeout(() => {
                const currentMsg = document.getElementById('dynamicMessage').innerHTML;
                document.getElementById('dynamicMessage').innerHTML =
                    currentMsg + '<br><small style="color:#8b4513; font-size:0.9em;">🎵 右下角可以播放尤克里里生日快乐歌</small>';
            }, 3000);
        };
    </script>
</body>
</html>
